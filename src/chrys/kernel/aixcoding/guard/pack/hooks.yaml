#
# iCode security-interception hook configuration.
#
# Install (the merge script is recommended; it does not overwrite an existing hooks.yaml):
#   uv run python -m aixcoding.tools.guard_install_merge
#
# Interpreter policy (why not type: script): iCode picks an interpreter from PATH in the
# order uv -> python3 -> python and does not filter out the Microsoft Store forwarding
# stub; once python3 resolves to the stub under %LOCALAPPDATA%\Microsoft\WindowsApps the
# hook cannot start (exit 9009), and with on_error: block that blocks every single prompt.
# So this file starts a PowerShell launcher (guard\_launcher.ps1) instead, which looks for
# a real python at every execution:
#   1. python.exe on PATH (skipping 0-byte and forwarding-point stubs);
#   2. the embedded interpreter the packaged iCode extracts on first run at
#      %LOCALAPPDATA%\pyapp\data\chrys\<hash>\<version>\python\python.exe.
# The configuration is therefore portable: copy the whole hooks directory (including
# guard/) to another machine and it runs there with no Python install and no reinstall.
# The launcher path in argv is relative and resolved by cwd: ${chrys_home}/hooks, so a
# manual install targets the per-user configuration directory.
#
# Linux / macOS: the PowerShell launcher is Windows-only. On POSIX switch run back to
# type: script (iCode picks python3 from PATH there, and POSIX has no store stub); the
# _install_merge.py installer performs that rewrite automatically, a manual copy does not.
#
# Manual: copy the whole guard/ subdirectory (including _launcher.ps1) to
#   <config_dir>/hooks/guard/ (default %APPDATA%\chrys\hooks\guard\), then append this
#   file's hooks list to the hooks.yaml there.
#
# Validate: aixcoding-cli hook validate   Inspect: aixcoding-cli hook list
version: 1

settings:
  shutdown_grace_seconds: 30
  max_parallel_hooks: 4

hooks:
  # Prompt-layer interception: IN-01 ~ IN-09.
  # on_error: block + timeout_seconds: 120 is the rule table's "failure fallback": a
  # child-process timeout, a crash or an engine error blocks this turn's request outright
  # instead of letting it through silently.
  # Released disabled in this version (temporary shutdown: field reports of false
  # positives blocking normal work): enabled stays false, and the hook engine filters
  # disabled entries at load time, so no child process starts, nothing is intercepted and
  # nothing is recorded (guardctl's engine switch is not consulted while this lasts). The
  # installer overwrites same-id managed entries wholesale from this template on every
  # start, so machines still carrying the old guard are disabled on their first start
  # after upgrading, and a local hand edit is pulled back as well;
  # To restore: flip both enabled values below back to true and cut a release.
  - id: security-prompt-guard
    event: user_prompt_submit
    enabled: false
    description: Prompt-layer security interception (decompilers/attack tooling, injection payloads, arbitrary IPs and intranet assets, compliance; a hit interrupts the turn with a notice)
    run:
      type: command
      cwd: ${chrys_home}/hooks
      argv:
        - 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
        - '-NoProfile'
        - '-NonInteractive'
        - '-ExecutionPolicy'
        - 'Bypass'
        - '-File'
        - 'guard\_launcher.ps1'
      env:
        GUARD_SCRIPT: guard\_prompt_guard.py
    execution:
      mode: blocking
      timeout_seconds: 120
      on_error: block

  # Pre-tool-call interception: the full T-* rule set.
  - id: security-tool-guard
    event: before_tool_call
    enabled: false
    description: Pre-tool-call security interception (Shell/PowerShell/Python, filesystem, network, MCP, sensitive data)
    run:
      type: command
      cwd: ${chrys_home}/hooks
      argv:
        - 'C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe'
        - '-NoProfile'
        - '-NonInteractive'
        - '-ExecutionPolicy'
        - 'Bypass'
        - '-File'
        - 'guard\_launcher.ps1'
      env:
        GUARD_SCRIPT: guard\_tool_guard.py
    execution:
      mode: blocking
      timeout_seconds: 120
      on_error: block

# The streaming-output layer (STREAM_CHUNK - _stream_guard.py) is not implemented in this
# round. A hook subprocess gets DEVNULL on stdin, so a script can neither rewrite streamed
# output nor interact with the user in real time; that layer needs iCode to expose a
# writable and interruptible output channel first.
