# Auto-retry failed CD jobs (up to 3 re-runs).
#
# This must be a separate workflow: `rerun-failed-jobs` only accepts runs in
# the `completed` state, and a `retry-failed` job inside cd.yml itself keeps
# that run in `running` until it exits — so the API call always fails with
# HTTP 403 "This workflow is already running". Watching CD from an outside
# run removes the self-conflict.
name: CD retry

on:
  workflow_run:
    workflows: [CD]
    types: [completed]

permissions:
  contents: read

jobs:
  retry-failed:
    name: Re-run failed CD jobs
    # github.event.workflow_run.run_attempt increments on every re-run;
    # < 4 means at most 3 automatic retries, then it stays failed.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.run_attempt < 4
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Re-run failed jobs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api -X POST \
            "repos/${GH_REPO}/actions/runs/${{ github.event.workflow_run.id }}/rerun-failed-jobs"
          echo "Re-run triggered (attempt ${{ github.event.workflow_run.run_attempt }}, max 4)."
