name: AIxCoding Tests

# Custom-asset quality gate (ADR-0004): everything under aixcoding/ plus the
# governance tools. Upstream ci.yml never sees these paths.
# Design & sign-off: aixcoding/docs/batches/ci-gate/design.md (R2 approved 2026-10-25)
# Windows matrix + three-layer layout (test/govern/gate):
# aixcoding/docs/batches/windows-matrix/design.md (confirmed 2026-11-01)

on:
  pull_request:
    branches: [main_aixcoding_cli]
  push:
    branches: [main_aixcoding_cli]
  schedule:
    - cron: "0 18 * * *" # daily 02:00 Beijing: full custom domains on trunk (backstop)
  workflow_dispatch:

# ci-gate-domains: event-name suffix keeps push and nightly on the same ref from
# cancelling each other (nightly is the independent re-check after a push run
# fails or gets cancelled).
concurrency:
  group: aixcoding-tests-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ci-gate-domains batch: domain-scope filter — single-implementation
  # classifier (aixcoding/tools/ci_impact.py --domains), same pattern as the
  # upstream bridge. Non-PR events (push/schedule/dispatch) always run both
  # custom domains (trunk full-suite backstop, never reads base.sha).
  filter:
    runs-on: ubuntu-slim
    outputs:
      test_touched: ${{ steps.f.outputs.test_touched }}
      guard_touched: ${{ steps.f.outputs.guard_touched }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: probe
        # VERSION gate, not existence: _common.py uses PEP 758 (Python 3.14+),
        # ubuntu-slim's system python3 is 3.12 (upstream-ci-tiering run #125) —
        # the pinned setup-python is the effective path on current runners.
        run: |
          if command -v python3 >/dev/null 2>&1 && python3 -c 'import sys; sys.exit(0 if sys.version_info >= (3, 14) else 1)'; then
            echo "missing=false" >> "$GITHUB_OUTPUT"
          else
            echo "missing=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: steps.probe.outputs.missing == 'true'
        with:
          python-version-file: .python-version
          allow-prereleases: true
      - id: f
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        # Fail-closed: classifier failure aborts under set -e; the verdict must
        # be exactly two lines with legal values (whitelisted combinations) —
        # anything else fails this job and the gate refuses to go green.
        run: |
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "test_touched=true" >> "$GITHUB_OUTPUT"
            echo "guard_touched=true" >> "$GITHUB_OUTPUT"
            echo "non-PR event ($EVENT_NAME): both custom domains by design (trunk backstop)"
            exit 0
          fi
          git -c core.quotePath=off diff --name-only --no-renames "$BASE_SHA" HEAD > /tmp/changed.txt
          test -s /tmp/changed.txt
          python3 aixcoding/tools/ci_impact.py --domains /tmp/changed.txt > /tmp/domains.txt
          [ "$(wc -l < /tmp/domains.txt)" = "2" ] || { cat /tmp/domains.txt >&2; exit 1; }
          tt=$(sed -n 's/^test_touched=//p' /tmp/domains.txt)
          gt=$(sed -n 's/^guard_touched=//p' /tmp/domains.txt)
          case "$tt$gt" in
            truetrue | truefalse | falsetrue | falsefalse) ;;
            *) echo "malformed classifier output: '$tt' / '$gt'" >&2; exit 1 ;;
          esac
          echo "test_touched=$tt" >> "$GITHUB_OUTPUT"
          echo "guard_touched=$gt" >> "$GITHUB_OUTPUT"
  test:
    needs: filter
    if: needs.filter.outputs.test_touched == 'true'
    name: Custom tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Keep temporary files on the local disk (Windows)
        # Same rationale as upstream ci.yml test_windows: TEMP defaults to C:
        # (the runner's network-backed OS disk); D: local storage measures
        # 6-10x faster for the suite's tmp churn. Runs before checkout.
        if: runner.os == 'Windows'
        run: |
          $temp = Join-Path $env:RUNNER_TEMP "tmp"
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          "TEMP=$temp" >> $env:GITHUB_ENV
          "TMP=$temp" >> $env:GITHUB_ENV
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          prune-cache: true
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          allow-prereleases: true
      - name: Cache .venv (Windows)
        # Same key as upstream ci.yml test_windows on purpose: identical
        # `uv sync` + lockfile, so one shared cache entry per OS; uv sync
        # re-syncs the environment exactly regardless of cache origin.
        if: runner.os == 'Windows'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('.python-version', 'uv.lock', 'pyproject.toml') }}
      - run: uv sync
      - name: Custom test suite
        # Same pytest command on both OSes (byte-identical, easy to diff);
        # -rA goes through the env so the command text stays unchanged from
        # the pre-matrix gate. -rA lists every PASSED/SKIPPED nodeid in the
        # short summary — the DPAPI acceptance evidence (windows-matrix).
        env:
          PYTEST_ADDOPTS: "-rA"
        run: uv run pytest aixcoding/tests -m "not integration and not gc_calibration"

  guard:
    # Security guard rule pack validation (batches/guard-hooks): install into the
    # platform config dir, run the pack's stdlib selftest, then replay the
    # MANUAL_TESTS corpus against the deployed copy. The pack engine is pure
    # stdlib; platform differences can only surface in path resolution and the
    # config dir, so all three OSes run it (same rationale as the legacy branch).
    name: Guard hooks (${{ matrix.os }})
    needs: filter
    if: needs.filter.outputs.guard_touched == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      # Windows 运行器控制台是 cp1252/cp936：自检会打印中文，不固定 UTF-8 会
      # UnicodeEncodeError，用例全过也被判失败。
      PYTHONUTF8: "1"
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          prune-cache: true
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          allow-prereleases: true
      - run: uv sync
      - name: Install guard hooks (platform config dir)
        run: uv run python -c "from chrys.kernel.aixcoding.guard.guard_install import install_guard_hooks; install_guard_hooks()"
      - name: Rule pack selftest
        run: uv run python -m aixcoding.tests.guard.guard_pack_selftest
      - name: Deployed-package verification (MANUAL_TESTS corpus)
        run: uv run python aixcoding/tests/guard/verify_guard_deployed.py

  govern:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Full history: the R2/R3 gates diff against the fork point with
      # origin/main_iCode (the pure upstream mirror branch).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          prune-cache: true
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          allow-prereleases: true
      - run: uv sync

      # --- ADR-0004 quality gate, lint + docs steps ------------------------
      # upstream-ci-tiering backfill: pure-custom PRs skip the upstream suite,
      # which used to carry ruff/format for src/chrys/{tier}/aixcoding/ —
      # those checks now run here on the custom paths (same pyproject config).
      - name: Collect custom product paths
        run: |
          CUSTOM_SRC=$(find src/chrys -mindepth 2 -maxdepth 2 -type d -name aixcoding | tr '\n' ' ')
          test -n "$CUSTOM_SRC"
          echo "CUSTOM_SRC=$CUSTOM_SRC" >> "$GITHUB_ENV"
      - run: uv run ruff check aixcoding/ $CUSTOM_SRC
      - run: uv run ruff format --check aixcoding/ $CUSTOM_SRC
      - run: uv run python aixcoding/tools/check_docs.py --closure

      # --- Custom product static checks (upstream-ci-tiering backfill) -------
      # ty with explicit three-platform views (upstream AGENTS.md convention):
      # the custom layer is platform-sensitive (DPAPI/win32 branches in
      # auth/crypto.py etc.), a single default-platform pass would silently
      # drop the win32 type view (peer review F1).
      - run: uv run ty check --error-on-warning --python-platform linux $CUSTOM_SRC
      - run: uv run ty check --error-on-warning --python-platform darwin $CUSTOM_SRC
      - run: uv run ty check --error-on-warning --python-platform win32 $CUSTOM_SRC
      - run: uv run python -m compileall -q $CUSTOM_SRC

      # --- Governance tools (aixcoding/docs/batches/devtools) ---------------
      - run: uv run python aixcoding/tools/check_import_boundaries.py

      - name: Customization registry reconciliation (strict)
        # Reconciles code markers against the point-level registration tables
        # of signed-off design.md files. The CUSTOMIZATIONS.md manifest was
        # retired with the customization-registry batch (ADR-0015): the gate
        # is now direct reconciliation, not derived-artifact freshness.
        run: uv run python aixcoding/tools/gen_customizations.py --strict

      - name: R2 / R3 gates against the upstream fork point
        run: |
          BASE="$(git merge-base origin/main_iCode HEAD)"
          echo "upstream fork point: $BASE"
          uv run python aixcoding/tools/check_r2_diff.py --base "$BASE"
          uv run python aixcoding/tools/check_r3_markers.py --base "$BASE"

  gate:
    # One stable required-check name for the whole matrix (branch-protection
    # matches job-level check runs). Always runs and fail-closed. Per-domain
    # state machine (ci-gate-domains): compliance (govern) must always be
    # success; each on-demand domain must be exactly (touched && success) or
    # (untouched && skipped) — filter failure / missing output / cancelled
    # never go green. The step echoes each domain's outcome so a green gate
    # shows what actually ran.
    name: AIxCoding quality gate
    needs: [filter, test, govern, guard]
    if: always()
    runs-on: ubuntu-slim
    steps:
      - name: Verify tests and governance
        env:
          FILTER_RESULT: ${{ needs.filter.result }}
          TEST_TOUCHED: ${{ needs.filter.outputs.test_touched }}
          GUARD_TOUCHED: ${{ needs.filter.outputs.guard_touched }}
          TEST_RESULT: ${{ needs.test.result }}
          GOVERN_RESULT: ${{ needs.govern.result }}
          GUARD_RESULT: ${{ needs.guard.result }}
        run: |
          test "$FILTER_RESULT" = "success"
          test "$GOVERN_RESULT" = "success"
          if [ "$TEST_TOUCHED" = "false" ]; then
            test "$TEST_RESULT" = "skipped"
            echo "aixcoding-tests domain: skipped by scope (push/nightly backstop)"
          else
            test "$TEST_TOUCHED" = "true"
            test "$TEST_RESULT" = "success"
            echo "aixcoding-tests domain: success"
          fi
          if [ "$GUARD_TOUCHED" = "false" ]; then
            test "$GUARD_RESULT" = "skipped"
            echo "guard-deploy domain: skipped by scope (push/nightly backstop)"
          else
            test "$GUARD_TOUCHED" = "true"
            test "$GUARD_RESULT" = "success"
            echo "guard-deploy domain: success"
          fi
